name: CI Checks 

on:
  push: 
    branches: [main]
  pull_request: 
    branches: [main]

jobs: 
  gitleaks:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## 🔒 Gitleaks Secret Scan" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ No secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Potential secrets found — check the scan output above" >> $GITHUB_STEP_SUMMARY
          fi
 
  validate-compose:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4


      - name: Validate all compose files
        id: validate
        run: |
          echo "## 📋 Compose Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          fail=0
          find . -name "docker-compose.yml" -o -name "docker-compose.yaml" | while read -r file; do
            if docker compose -f "$file" config --no-interpolate > /dev/null 2>&1; then
              echo "- ✅ \`$file\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ \`$file\`" >> $GITHUB_STEP_SUMMARY
              fail=1
            fi
          done
          exit $fail

