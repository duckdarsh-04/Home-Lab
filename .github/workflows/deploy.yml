name: Deploy changed service

on:
  push:
    branches: [main]
    paths:
      - '**/docker-compose.yml'
      - '**/docker-compose.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed compose file(s)
        id: changed
        run: |
          echo "files=$(git diff --name-only HEAD^ HEAD -- '**/docker-compose.yml' '**/docker-compose.yaml' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/duckdarsh/home-lab/configs
            git pull
            for f in ${{ steps.changed.outputs.files }}; do
              dir=$(dirname "$f")
              echo "Redeploying $dir"
              (cd "$dir" && docker compose pull && docker compose up -d)
            done
