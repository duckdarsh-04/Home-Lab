services :
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    volumes: 
      - /home/duckdarsh/home-lab/secrets/searxng:/etc/searxng:rw
      - /home/duckdarsh/home-lab/appdata/apps/searxng/cache:/var/cache/searxng:rw
    #environment:
      #- SEARXNG_BASE_URL=http://searxng.nixos.duckdarsh.home/
    depends_on: 
      - redis
    networks:
      - frontend
  redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes: 
      - /home/duckdarsh/home-lab/appdata/apps/searxng/valkey:/data
    networks: 
      - frontend

networks:
  frontend:
    external: true

